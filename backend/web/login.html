<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIG WASH - Авторизація</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Анімовані бульбашки */
        .bubbles {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .bubble {
            position: absolute;
            bottom: -100px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: rise 15s infinite ease-in;
        }

        .bubble:nth-child(1) { width: 40px; height: 40px; left: 10%; animation-delay: 0s; }
        .bubble:nth-child(2) { width: 20px; height: 20px; left: 20%; animation-delay: 2s; }
        .bubble:nth-child(3) { width: 50px; height: 50px; left: 35%; animation-delay: 4s; }
        .bubble:nth-child(4) { width: 80px; height: 80px; left: 50%; animation-delay: 0s; }
        .bubble:nth-child(5) { width: 35px; height: 35px; left: 55%; animation-delay: 3s; }
        .bubble:nth-child(6) { width: 45px; height: 45px; left: 65%; animation-delay: 7s; }
        .bubble:nth-child(7) { width: 90px; height: 90px; left: 80%; animation-delay: 2s; }
        .bubble:nth-child(8) { width: 25px; height: 25px; left: 90%; animation-delay: 5s; }

        @keyframes rise {
            0% {
                bottom: -100px;
                transform: translateX(0);
            }
            50% {
                transform: translateX(100px);
            }
            100% {
                bottom: 1080px;
                transform: translateX(-200px);
            }
        }

        .container {
            position: relative;
            z-index: 1;
            width: 900px;
            height: 550px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 80px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            display: flex;
        }

        .form-container {
            position: absolute;
            top: 0;
            height: 100%;
            transition: all 0.6s ease-in-out;
        }

        .sign-in-container {
            left: 0;
            width: 50%;
            z-index: 2;
        }

        .sign-up-container {
            left: 0;
            width: 50%;
            opacity: 0;
            z-index: 1;
        }

        .container.right-panel-active .sign-in-container {
            transform: translateX(100%);
        }

        .container.right-panel-active .sign-up-container {
            transform: translateX(100%);
            opacity: 1;
            z-index: 5;
            animation: show 0.6s;
        }

        @keyframes show {
            0%, 49.99% {
                opacity: 0;
                z-index: 1;
            }
            50%, 100% {
                opacity: 1;
                z-index: 5;
            }
        }

        .overlay-container {
            position: absolute;
            top: 0;
            left: 50%;
            width: 50%;
            height: 100%;
            overflow: hidden;
            transition: transform 0.6s ease-in-out;
            z-index: 100;
        }

        .container.right-panel-active .overlay-container {
            transform: translateX(-100%);
        }

        .overlay {
            background: linear-gradient(135deg, #2a5298 0%, #1e3c72 100%);
            background-repeat: no-repeat;
            background-size: cover;
            background-position: 0 0;
            color: white;
            position: relative;
            left: -100%;
            height: 100%;
            width: 200%;
            transform: translateX(0);
            transition: transform 0.6s ease-in-out;
        }

        .container.right-panel-active .overlay {
            transform: translateX(50%);
        }

        .overlay-panel {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 0 40px;
            text-align: center;
            top: 0;
            height: 100%;
            width: 50%;
            transform: translateX(0);
            transition: transform 0.6s ease-in-out;
        }

        .overlay-left {
            transform: translateX(-20%);
        }

        .container.right-panel-active .overlay-left {
            transform: translateX(0);
        }

        .overlay-right {
            right: 0;
            transform: translateX(0);
        }

        .container.right-panel-active .overlay-right {
            transform: translateX(20%);
        }

        form {
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 0 50px;
            height: 100%;
            text-align: center;
        }

        .logo {
            font-size: 48px;
            font-weight: bold;
            color: #1e3c72;
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-weight: bold;
            margin: 0;
            color: #1e3c72;
            font-size: 28px;
        }

        .overlay-panel h1 {
            color: white;
        }

        p {
            font-size: 14px;
            font-weight: 100;
            line-height: 20px;
            letter-spacing: 0.5px;
            margin: 20px 0 30px;
        }

        input {
            background: #f6f9fc;
            border: 1px solid #e0e6ed;
            padding: 12px 15px;
            margin: 8px 0;
            width: 100%;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #2a5298;
            background: white;
            box-shadow: 0 0 0 3px rgba(42, 82, 152, 0.1);
        }

        button {
            border-radius: 20px;
            border: 1px solid #2a5298;
            background: linear-gradient(135deg, #2a5298 0%, #1e3c72 100%);
            color: white;
            font-size: 14px;
            font-weight: bold;
            padding: 12px 45px;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            box-shadow: 0 7px 14px rgba(42, 82, 152, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button.ghost {
            background: transparent;
            border-color: white;
        }

        button.ghost:hover {
            background: white;
            color: #2a5298;
        }

        .name-inputs {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .name-inputs input {
            flex: 1;
        }

        .password-container {
            position: relative;
            width: 100%;
        }

        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #666;
            font-size: 18px;
            user-select: none;
        }

        .error-message {
            color: #dc2626;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        @media (max-width: 768px) {
            .container {
                width: 100%;
                height: 100vh;
                border-radius: 0;
            }

            .form-container {
                width: 100% !important;
            }

            .overlay-container {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="bubbles">
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
    </div>

    <div class="container" id="container">
        <div class="form-container sign-up-container">
            <form id="signupForm">
                <div class="logo">BIG WASH</div>
                <h1>Створити акаунт</h1>
                <div class="name-inputs">
                    <input type="text" placeholder="Ім'я" id="signup-firstname" required />
                    <input type="text" placeholder="Прізвище" id="signup-lastname" required />
                </div>
                <input type="tel" placeholder="Телефон" id="signup-phone" required />
                <input type="email" placeholder="Email" id="signup-email" required />
                <div class="password-container">
                    <input type="password" placeholder="Пароль" id="signup-password" required />
                    <span class="password-toggle" onclick="togglePassword('signup-password', this)">👁️</span>
                </div>
                <button type="submit">Реєстрація</button>
                <div class="error-message" id="signup-error"></div>
            </form>
        </div>

        <div class="form-container sign-in-container">
            <form id="signinForm">
                <div class="logo">BIG WASH</div>
                <h1>Авторизація</h1>
                <input type="email" placeholder="Email або Телефон" id="signin-email" required />
                <div class="password-container">
                    <input type="password" placeholder="Пароль" id="signin-password" required />
                    <span class="password-toggle" onclick="togglePassword('signin-password', this)">👁️</span>
                </div>
                <button type="submit">Увійти</button>
                <div class="error-message" id="signin-error"></div>
            </form>
        </div>

        <div class="overlay-container">
            <div class="overlay">
                <div class="overlay-panel overlay-left">
                    <h1>Вже є акаунт?</h1>
                    <p>Увійдіть, щоб продовжити керування вашими автомийками</p>
                    <button class="ghost" id="signIn">Увійти</button>
                </div>
                <div class="overlay-panel overlay-right">
                    <h1>Немає акаунту?</h1>
                    <p>Зареєструйтесь та почніть керувати своїми автомийками</p>
                    <button class="ghost" id="signUp">Реєстрація</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const signUpButton = document.getElementById('signUp');
        const signInButton = document.getElementById('signIn');
        const container = document.getElementById('container');

        signUpButton.addEventListener('click', () => {
            container.classList.add('right-panel-active');
        });

        signInButton.addEventListener('click', () => {
            container.classList.remove('right-panel-active');
        });

        function togglePassword(inputId, icon) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = '🙈';
            } else {
                input.type = 'password';
                icon.textContent = '👁️';
            }
        }

        // Обробка форми входу
        document.getElementById('signinForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('signin-email').value;
            const password = document.getElementById('signin-password').value;
            const errorDiv = document.getElementById('signin-error');

            try {
                const response = await fetch('http://localhost:8080/api/v1/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // Зберігаємо дані та перенаправляємо БЕЗ alert
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = '/web/dashboard.html';
                } else {
                    // Показуємо помилку
                    errorDiv.textContent = data.error || 'Невірний email або пароль';
                    errorDiv.classList.add('show');
                }
            } catch (error) {
                errorDiv.textContent = 'Помилка з\'єднання з сервером';
                errorDiv.classList.add('show');
                console.error(error);
            }
        });

        // Обробка форми реєстрації
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const firstname = document.getElementById('signup-firstname').value;
            const lastname = document.getElementById('signup-lastname').value;
            const phone = document.getElementById('signup-phone').value;
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;
            const errorDiv = document.getElementById('signup-error');

            try {
                const response = await fetch('http://localhost:8080/api/v1/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ firstname, lastname, phone, email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // Переключаємось на форму входу БЕЗ alert
                    container.classList.remove('right-panel-active');
                    document.getElementById('signupForm').reset();
                    errorDiv.classList.remove('show');
                    
                    // Показуємо успіх в формі входу
                    const signinError = document.getElementById('signin-error');
                    signinError.style.color = '#10b981';
                    signinError.textContent = 'Реєстрація успішна! Тепер можете увійти';
                    signinError.classList.add('show');
                    setTimeout(() => {
                        signinError.classList.remove('show');
                        signinError.style.color = '#dc2626';
                    }, 3000);
                } else {
                    errorDiv.textContent = data.error || 'Помилка реєстрації';
                    errorDiv.classList.add('show');
                }
            } catch (error) {
                errorDiv.textContent = 'Помилка з\'єднання з сервером';
                errorDiv.classList.add('show');
                console.error(error);
            }
        });
    </script>
</body>
</html>
